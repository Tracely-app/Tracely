name: check

# Catches a broken main between releases, for both halves of this repo: the
# desktop app (typecheck + its test suite) and server/ (the API behind the
# extension and, soon, the desktop).
#
# Restricted to PRs and main rather than every push: `npm ci` here pulls
# Electron, transformers.js and onnxruntime, which is minutes, not seconds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: `npm test` runs .ts test files straight through Node's
          # type stripping, which does not exist on 20. Matches the local dev
          # version, so a green CI and a green laptop mean the same thing.
          node-version: 24
          cache: npm

      # server/ has ZERO npm dependencies, so its suite runs before `npm ci`
      # and needs nothing installed.
      #
      # It was not in CI at all until now. This workflow ran only the desktop's
      # `npm test`, so server/'s suite — the one guarding the API the shipped
      # extension talks to, the spend ceiling, the plan clamp and billing —
      # passed or failed on whoever happened to run it locally. A server change
      # could merge red and nobody would know until it was deployed.
      - name: server tests
        working-directory: server
        run: npm test

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # Guards the eval harness, which is the project's only quality gate. It
      # breaks in a way typecheck cannot see: importing anything that reaches
      # Electron pulls the binary shim into a bundle meant for plain node, and
      # the eval then fails at runtime rather than at build.
      - name: eval bundle has no Electron
        run: npm run check:eval-bundle

# Deliberately not here: building the installer (slow, and afterPack already
# gates it locally) and anything that spends money. CI that costs per run is CI
# that gets switched off.
