name: labeler

# Applies the surface labels in .github/labeler.yml from the files a PR
# touches, so "what is in flight on the extension?" is one `gh pr list
# --label extension` away for either agent. pull_request_target so it can
# label PRs from forks too; it checks nothing out and runs no project code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
