name: preview

# Publishes an integration preview every time main moves.
#
# Before this existed, the only way to get an installable build of integrated
# main was for Merrick to run `npm run ship:preview` on his own laptop. That
# made the shared preview depend on one machine being awake and one person
# remembering, so in practice it never happened between releases and reviewers
# were left running `npm run dev` against their own trees — each seeing a
# different app.
#
# Now: merge to main -> this builds on Windows -> the preview channel updates ->
# every installed "Tracely Preview" picks it up on next launch. Nobody's laptop
# is in the loop.
#
# This deliberately does NOT cut real releases. `npm run ship` stays a manual
# decision on Merrick's machine, so the production Supabase credentials never
# enter CI. The blast radius of everything here is the preview
# channel, which only reviewers install.

on:
  push:
    branches: [main]

# A second merge while a build is running should supersede it, not queue behind
# it — the newer build is a strict superset of main. `cancel-in-progress` and
# not a queue, because two concurrent runs would both try to bump the version
# and one would lose the push race.
concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    # Guards against a LOCAL `npm run ship:preview` retriggering this.
    #
    # The two paths through ship-preview.mjs differ here, and the difference is
    # the whole reason this condition exists. Run locally on main, the script
    # commits `Preview v<version>` and pushes it — a push to main, which without
    # this guard starts a build, whose... nothing. CI does not commit, so the
    # loop terminates after one extra build rather than running forever. Still
    # a wasted Windows build and a duplicate prerelease per local publish.
    #
    # This comment used to say CI itself commits the bump and would retrigger
    # itself "forever, one beta per cycle". That stopped being true when the CI
    # path moved to GITHUB_RUN_NUMBER (ship-preview.mjs, `if (CI)`): nothing is
    # committed and nothing is pushed there, because `check` is a required
    # status check on main and a bot push would deadlock against it. The guard
    # is still load-bearing — just for the local path, not this one.
    #
    # Also skipped on forks, where none of the secrets below exist and the
    # build would fail on the first preflight check rather than doing anything
    # useful.
    if: >-
      github.repository == 'Tracely-app/Tracely' &&
      !startsWith(github.event.head_commit.message, 'Preview v')

    # electron-builder --win produces an NSIS installer, which needs Windows.
    # This is the whole reason the cloud routines cannot publish previews
    # themselves: they run on Linux.
    runs-on: windows-latest

    # For creating the GitHub prerelease and uploading the installer to it —
    # electron-builder does that with GITHUB_TOKEN, and releases live under the
    # contents scope. NOT for pushing: the CI path commits nothing and moves no
    # tag (both are behind `if (!CI)` in ship-preview.mjs), and could not push
    # to main anyway with `check` required on it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # preflight compares HEAD against origin/main and ship-preview.mjs
          # moves a tag, so the shallow default clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 24 to match check.yml and local dev — npm test runs .ts files
          # through Node's type stripping, which does not exist on 20.
          node-version: 24
          cache: npm

      - run: npm ci

      # loadEnv() refuses to fall back to .env when staging is requested, and
      # it is right to: that fallback would build something labelled "preview",
      # point it at production Supabase, and publish it to reviewers. So the
      # file has to exist, and it has to hold staging values. It is gitignored,
      # so writing it here does not dirty the tree that preflight is about to
      # check.
      #
      # NCBI and Semantic Scholar keys are optional — they are used by the eval
      # harness rather than the build, and an empty value degrades those
      # providers rather than breaking the installer.
      #
      # STAGING_RELAY_URL / STAGING_RELAY_TOKEN are no longer read: the app
      # talks to the Tracely server now. The server URL is optional too. With
      # no STAGING_API_URL secret the build uses the default
      # (https://api.jointracely.com — see apiUrl() in scripts/env.mjs), and
      # the line is written only when the secret exists, so a missing secret
      # never becomes an empty TRACELY_API_URL= in the file. env.mjs would
      # treat blank as unset anyway; not writing it keeps the file honest.
      - name: write .env.staging
        shell: bash
        env:
          TRACELY_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          cat > .env.staging <<'EOF'
          SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NCBI_API_KEY=${{ secrets.NCBI_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          EOF
          if [ -n "$TRACELY_API_URL" ]; then
            echo "TRACELY_API_URL=$TRACELY_API_URL" >> .env.staging
          fi

      # ship-preview.mjs runs `git commit` and `git push`. A fresh runner has no
      # identity configured, so the commit fails before the build ever starts.
      - name: configure git identity
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # GH_TOKEN is read from the environment here rather than .env.release,
      # which does not and should not exist in CI. GITHUB_TOKEN is scoped to
      # this repository and expires when the job ends.
      # Same shape as mac-installers.yml, same reason: an absent secret in a
      # step-level env: becomes "", which electron-builder reads as a real
      # certificate path. Both credential shapes are pre-wired so whichever
      # Windows signing route is bought later needs no workflow edit — the
      # AZURE_* vars stay inert until win.azureSignOptions exists in the yml.
      - name: resolve Windows signing env
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            {
              echo "WIN_CSC_LINK<<__TRACELY_EOF__"
              echo "$WIN_CSC_LINK"
              echo "__TRACELY_EOF__"
            } >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID" >> "$GITHUB_ENV"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID" >> "$GITHUB_ENV"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$WIN_CSC_LINK$AZURE_TENANT_ID" ]; then
            echo "::notice::Windows signing enabled."
          else
            echo "::notice::Windows signing not configured — unsigned, as before."
          fi

      # The per-platform binary split is a BUILD STEP, not config: a
      # platform-scoped `files:` block silently resets the exclude list to
      # **/* and drops every other exclude (BUILDING.md). electron-builder.yml
      # therefore excludes only linux and win32/arm64 and KEEPS darwin, because
      # the mac build needs it — so a Windows build has to remove it here, and
      # mac-installers.yml does the mirror of this for the other direction.
      #
      # Missing this is what has failed every preview run since the
      # cross-platform packaging change landed: afterPack's ML guard correctly
      # rejected an installer carrying "onnxruntime-node/bin/napi-v6/darwin
      # ... wrong platform". The guard was doing its job; nothing fed it a
      # clean tree.
      # The list of what to remove lives in scripts/strip-foreign-natives.mjs
      # now, because it was ONLY here: CI stripped and every local `npm run
      # ship` did not, so previews built while the stable release died at
      # afterPack. That script is also wired into preview:win / release:win /
      # dist:win, which makes this step redundant — kept anyway, so the strip
      # still happens if those npm scripts are ever reordered, and so the log
      # says plainly that it ran. It is idempotent.
      - name: strip foreign-platform native binaries
        shell: bash
        run: |
          node scripts/strip-foreign-natives.mjs
          echo "remaining onnxruntime platforms:"
          ls node_modules/onnxruntime-node/bin/napi-v6/ || true

      # The upload key for dl.jointracely.com, where the preview channel's feed
      # and installer actually live. Without it the build succeeds and
      # publish-dl.mjs dies at the first rsync — deliberately loudly, because
      # the alternative is a preview nobody can install.
      #
      # It is written to a file rather than passed through ssh-agent: the
      # runner is Windows, where the agent is a service that is not running by
      # default, and `ssh` there is Win32-OpenSSH which refuses a key file the
      # ACL lets anyone read. icacls is what makes it acceptable to it.
      - name: install the release upload key
        shell: bash
        env:
          DL_SSH_KEY: ${{ secrets.DL_SSH_KEY }}
        run: |
          if [ -z "$DL_SSH_KEY" ]; then
            echo "::error::DL_SSH_KEY is not set. Previews are delivered from dl.jointracely.com and cannot be published without it — see DEPLOY.md 'Release hosting'."
            exit 1
          fi
          key="$RUNNER_TEMP/tracely-dl"
          printf '%s\n' "$DL_SSH_KEY" > "$key"
          # Whichever ssh wins the PATH race here refuses a world-readable key:
          # Win32-OpenSSH checks the NTFS ACL directly, and Git-for-Windows' ssh
          # checks MSYS permissions, which are derived from that same ACL. So
          # the ACL is tightened for both, and chmod is kept for the MSYS view.
          icacls "$(cygpath -w "$key")" /inheritance:r /grant:r "$USERNAME:(R)" > /dev/null
          chmod 600 "$key"
          echo "TRACELY_DL_KEY=$key" >> "$GITHUB_ENV"

      - name: build and publish preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ship:preview
