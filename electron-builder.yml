appId: com.tracely.app
productName: Tracely
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # Dev docs and tooling never belong in a shipped app, and they leak the OTHER
  # environments' relay hosts: README / CONTRIBUTING / AGENTS / ROLLBACK /
  # .env.example / eval/FINDINGS.md all name tracely-relay-staging and the
  # tracely-relay.vercel.app alias in prose, which verify-packaged-ml's
  # foreign-host check correctly fails the build over. None is read at runtime
  # and nothing in src/ imports markdown, so this is pure dead weight otherwise.
  # Root-anchored forms (*.md, not **/*.md) are load-bearing: a leading **/ does
  # NOT match a file at the project root in electron-builder's matcher, which is
  # why README.md and .env.example survived the first attempt — while the nested
  # !out/eval/** exclude worked fine.
  - '!*.md'
  - '!**/*.md'
  - '!.env'
  - '!.env.example'
  - '!.env.*'
  - '!.claude'
  - '!.claude/**'
  - '!eval'
  - '!eval/**'
  # 114MB — 45% of the installer — of eval harness. scripts/evaluate.mjs bundles
  # itself into out/eval so plain node can resolve sql.js and the ML stack; it is
  # dev tooling and the app never loads it. It was shipping to every user along
  # with fixture databases and an 8.4MB NLI tokenizer.
  #
  # Worse in a preview build. out/ is not cleaned between environment switches,
  # so the staging installer carried out/eval bundles built against PRODUCTION —
  # folio-relay's host and shared token, from before per-user auth existed. A
  # staging build shipping production configuration is the exact thing the
  # environment split exists to prevent, and the leak check missed it because it
  # only ever grepped out/main/index.js.
  #
  # Excluding a whole directory here is what broke v0.3.76. This one is safe for
  # a reason that one was not: nothing in src/ imports it. verify-packaged-ml.mjs
  # now asserts both its absence and that no foreign relay host is in the asar.
  - '!out/eval/**'
  # Stray logs written into out/ by hand — `npm run evaluate > out/eval-run.log`
  # and friends. Small, but they are transcripts of a dev run and have no
  # business in a user's installer; `out/**/*` sweeps them in because they sit
  # beside out/eval rather than inside it.
  #
  # This blocked v0.3.86 and v0.3.87. An 8KB out/eval-run.log tripped
  # verify-packaged-ml's `out/eval` expectation, which matched it by SUBSTRING
  # and reported "114MB of eval harness" — so the build failed for a real reason
  # while naming the wrong one. The matcher is now boundary-aware; this glob is
  # what makes the file absent in the first place.
  - '!out/*.log'
  # The ML stack is INCLUDED as of here, trimmed rather than excluded.
  #
  # It was excluded wholesale through v0.3.76, when nothing called embed().
  # That stopped being true once dense relevance landed in scoring.ts, and the
  # exclusion then became a silent regression rather than a saving: the worker
  # cannot load, services/ml/index.ts degrades to lexical scoring, and the
  # packaged app quietly runs the old word-overlap path while every measurement
  # says otherwise. Nothing errors. Do not re-add a blanket exclusion here
  # without also checking what calls embed().
  #
  # Untrimmed the stack is ~380MB. What is dropped, and why:

  # 202MB of models downloaded during development. The weights that actually
  # ship are fetched into resources/models by scripts/fetch-models.mjs and
  # copied via extraResources below.
  - '!node_modules/@huggingface/transformers/.cache/**'
  # TypeScript sources and type declarations — dist/ is what gets imported.
  - '!node_modules/@huggingface/transformers/src/**'
  - '!node_modules/@huggingface/transformers/types/**'

  # onnxruntime binaries for architectures no target ever is. darwin and
  # win32/x64 are deliberately NOT excluded here — each is wanted on its own
  # platform, and a native `npm install` only ever fetches the current
  # platform's optional binary, so the OTHER platform's dir simply doesn't
  # exist to be packaged. (Cross-building from one machine, where both are
  # force-installed, strips the foreign one as a build step before packing —
  # see the mac/win build notes in README/CLAUDE. A platform-scoped `files:`
  # block was tried and silently RESET the whole file list to `**/*`, dropping
  # every exclude below and shipping the dev docs + .env into the asar.)
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

  # 128MB of WASM for the browser build. dist/transformers.node.mjs imports
  # onnxruntime-node and never this, so it is genuinely unreachable here.
  - '!node_modules/onnxruntime-web/**'

  # sharp and @img (~20MB) are NOT excluded, despite being image decoding for
  # vision models this app does not have. transformers.node.mjs has a
  # top-level `import sharp from "sharp"`, so excluding it breaks the import
  # of the whole library — and only in the packaged build, never in dev.
  # @img already ships win32-x64 alone; npm resolves those per platform.
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: build/icon.png
    to: icon.png
  - from: resources/uia-watch.ps1
    to: uia-watch.ps1
  - from: resources/scan-apps.ps1
    to: scan-apps.ps1
  # Populated by scripts/fetch-models.mjs, which the dist/release scripts run
  # first. Landing here is what makes services/ml/index.ts set
  # allowRemote=false, so a packaged app never reaches the network for weights
  # and never blocks a student's first analysis on a download.
  - from: resources/models
    to: models
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
  # worker_threads reads its entry script in native code, which does not go
  # through Electron's asar-aware fs patches — so a worker living inside the
  # archive may simply fail to start, in the packaged build only. When it does,
  # services/ml disables itself and retrieval degrades silently to lexical
  # scoring, which is the same invisible failure v0.3.76 shipped with.
  - out/main/mlWorker.js
  # And whatever the worker imports. electron-vite code-splits the main bundle,
  # so mlWorker.js's first statement is `require("./chunks/protocol-*.js")` —
  # unpacking the entry alone leaves it resolving a relative path inside
  # app.asar.unpacked, where the chunk does not exist. Measured on the shipped
  # v0.3.91/v0.3.92 installers: the chunk was in app.asar only, the worker threw
  # `Cannot find module './chunks/protocol-Bivu33iP.js'`, ml/index.ts latched
  # `unavailable` for the whole session, and 126 of 127 evidence searches in one
  # day ranked on lexical word overlap instead of MiniLM. Exactly the v0.3.76
  # failure again, one directory over.
  - out/main/chunks/**
  # onnxruntime_binding.node loads onnxruntime.dll (and DirectML.dll) from
  # beside itself at runtime, and sharp's binding does the same with its own
  # DLLs. Unpacking a .node without its DLLs leaves the binding resolvable and
  # its dependencies not — a failure that only appears in a packaged build,
  # never in dev.
  - '**/*.dll'
  # And the LIBRARY the worker imports by name, not just the files it requires
  # by path.
  #
  # This is the third form of the same failure. Unpacking mlWorker.js moved the
  # worker OUT of app.asar so worker_threads could read it — and Node then
  # resolves that worker's bare imports by walking up from its new location,
  # which is app.asar.unpacked. `@huggingface/transformers` is pure JS, so it
  # matched none of the globs above (onnxruntime-node is here only because
  # `**/*.node` and `**/*.dll` caught its binaries) and stayed inside the
  # archive, where the unpacked worker cannot reach it.
  #
  # Measured on the shipped v0.3.94-preview.184 installer, by running the
  # packaged worker directly: `Cannot find package '@huggingface/transformers'`.
  # ml/index.ts then latches `unavailable`, classifyClaim returns 'scholarly'
  # for EVERY claim because embedCached is null, and the two providers gated on
  # a routed domain — web search and Wikipedia — never run at all. Retrieval
  # also silently drops to lexical word overlap. Same silent degradation as
  # v0.3.76 and v0.3.91, a third directory over.
  #
  # sharp and the tokenizers are here because transformers.node.mjs imports them
  # at the top level; onnxruntime-web is deliberately NOT (128MB of browser WASM
  # the node entry never loads, and an expectation in verify-packaged-ml.mjs
  # keeps it out).
  - node_modules/@huggingface/jinja/**
  - node_modules/@huggingface/tokenizers/**
  - node_modules/@huggingface/transformers/**
  - node_modules/@img/colour/**
  - node_modules/adm-zip/**
  - node_modules/boolean/**
  - node_modules/define-data-property/**
  - node_modules/define-properties/**
  - node_modules/detect-libc/**
  - node_modules/detect-node/**
  - node_modules/es-define-property/**
  - node_modules/es-errors/**
  - node_modules/es6-error/**
  - node_modules/escape-string-regexp/**
  - node_modules/global-agent/**
  - node_modules/globalthis/**
  - node_modules/gopd/**
  - node_modules/has-property-descriptors/**
  - node_modules/json-stringify-safe/**
  - node_modules/matcher/**
  - node_modules/object-keys/**
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-node/**
  - node_modules/roarr/**
  - node_modules/semver/**
  - node_modules/semver-compare/**
  - node_modules/serialize-error/**
  - node_modules/sharp/**
  - node_modules/sprintf-js/**
  - node_modules/type-fest/**
  - node_modules/@img/**
npmRebuild: false
# Verifies the packed app can actually run embeddings, before the installer is
# built or published. See scripts/afterPack.js for why a green build is not
# sufficient evidence here.
afterPack: scripts/afterPack.js
# A `protocols:` block declaring `tracely://` stood here. It existed for one
# thing — Google's OAuth consent screen redirecting back into the app — and
# there is no sign-in to redirect into any more. Nothing in the app handles
# that scheme, so claiming it would point it at a program that does nothing
# with it, which is the exact failure mode the deleted comment was about.
win:
  target: nsis
  icon: build/icon.ico
  # publisherName belongs here once a certificate exists, set to that
  # certificate's exact common name: it is what electron-updater compares an
  # incoming installer against, and it is baked into app-update.yml at build
  # time — so a placeholder would ship inside every client. The Azure signing
  # block cannot be written before the signing account exists either. See
  # BUILDING.md "Code signing".
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  # Signing config, inert until a Developer ID certificate reaches the builder.
  # MacPackager.sign() gives up at "no valid identity" before any key below is
  # read, and notarization is only attempted after a successful signature — so
  # with no certificate this whole block is skipped and the build warns and
  # continues, exactly as it does today.
  #
  # forceCodeSigning is deliberately NOT set: it is the one flag that turns that
  # warning into a hard failure, so it goes in only once signed builds are
  # proven, together with `zip` (which macOS auto-update needs, and which is
  # pointless before signing because Squirrel.Mac requires a valid signature).
  # identity is deliberately left unset so the certificate is auto-discovered.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Also found by filename under directories.buildResources; named explicitly so
  # a rename cannot silently fall back to electron-builder's bundled default,
  # which carries an Electron-11-era entitlement this app must not ship.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Boolean on purpose. The object form (notarize: {teamId}) is deprecated in
  # electron-builder 25 and removed in 26; the Team ID comes from APPLE_TEAM_ID.
  notarize: true
# Where the SHIPPED app looks for updates. This string is baked into
# app-update.yml inside every installer and can never be changed for copies
# already installed, so it is a hostname we can repoint at DNS level — at a CDN,
# at another box — without touching the app.
#
# It was `provider: github` until the repo went private. electron-updater ships
# with no credentials and read release assets over GitHub's PUBLIC API, so
# private would have stopped auto-update for every installed copy — silently,
# because electron-updater logs the 404 and carries on. There is no token we
# could ship instead: anything that can read a private repo's releases can read
# its source.
#
# `generic` is download-only by design, which is the whole point: no credential
# exists on the client to leak. Uploading is therefore ours to do — electron-
# builder runs with --publish never and scripts/publish-dl.mjs moves the bytes.
# It still writes latest.yml / preview.yml into the output directory from this
# block, which is what the updater actually reads; delete this block and the
# build succeeds while nothing is ever offered to anyone.
#
# GitHub releases have NOT gone away. The tag, the release and a copy of the
# artifacts still land there through `gh`, which is authenticated and does not
# care that the repo is private — and publishing that release is what triggers
# mac-installers.yml.
publish:
  provider: generic
  url: https://dl.jointracely.com
  channel: latest
